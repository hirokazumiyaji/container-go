name: Release check

# Verifies a tag before it is published, and again on the tag itself. The
# point is that a tag is never the first time these run: the version
# invariants live in `go test ./...`, so drift is caught on the change that
# introduces it.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'CHANGELOG.md'
      - 'README.md'
      - 'README.ja.md'
      - 'SECURITY.md'
      - 'go.mod'
      - 'bench/go.mod'
      - '.github/workflows/release-check.yml'
      - 'internal/releasecheck/**'
  workflow_dispatch:

# Read-only: this workflow verifies, it never publishes. A release is cut by
# tagging, and the GitHub release is created by a maintainer.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The tag must name the version the docs advertise, and that version must be
  # the newest dated CHANGELOG section. internal/releasecheck asserts the
  # docs agree with each other; this asserts the tag agrees with them.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The tag is not fetched by default, and the check needs the history
          # to resolve which release is newest.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Docs and CHANGELOG agree on a version
        run: go test ./internal/releasecheck/...

      - name: Tag matches the latest CHANGELOG release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          latest=$(grep -Eo '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md \
                   | head -1 | sed -E 's/^## \[([0-9.]+)\].*/\1/')
          if [ -z "$latest" ]; then
            echo "::error::no dated release section found in CHANGELOG.md"
            exit 1
          fi
          if [ "$tagged" != "$latest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the latest CHANGELOG release $latest"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches CHANGELOG $latest"

      # A dry run of the full gate, so a maintainer can require all of it to
      # pass from a clean checkout before tagging.
      - name: Dry-run the release gate
        run: make release-check

  # Everything that must hold for a tag to be worth publishing. The root and
  # bench are separate modules, so each is verified on its own.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - run: go mod verify
      - run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

      - name: Verify the bench module
        working-directory: bench
        run: |
          go build ./...
          go vet ./...
          go test ./...
          go mod verify

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.0

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
