name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# No job here needs write access: they only check out, build, and test.
# Declaring it explicitly means the workflow does not inherit whatever
# default the repository happens to have.
#
# On the trust boundary for fork pull requests: every job here checks out
# the PR's code and runs `go test` against it, on a runner image that also
# has a Docker daemon. Fencing the Docker integration off a fork therefore
# limits how hard the daemon is driven, not whether untrusted code can
# reach it at all. The real boundaries are the ephemeral runner, the
# read-only token, and persist-credentials: false — the token is not in
# .git/config for the code under test to read. Isolating untrusted code
# from a daemon needs a separate runner or workflow; that is not something
# this file can express.
permissions:
  contents: read

# A new push supersedes the in-flight run. Without this, successive pushes
# start overlapping integration-docker matrices that pull the same images
# and contend for the same containers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Windows and macOS are the platforms the README claims support for, so
  # they need a build and unit-test guarantee rather than a claim. Only
  # ubuntu-latest running before meant a Windows path, ACL, or reaper
  # regression could not be caught at all, and macOS Apple Container
  # protocol changes went unnoticed.
  #
  # These are unit tests against a fake CLI runner. Neither runs a real
  # backend: Windows has no Apple Container, and the Apple live checks
  # need a service the hosted runner does not provide.
  #
  # The OS dimension is the point; the Go-version dimension is not. The
  # ubuntu `test` legs already cover 1.23.0, and macOS minutes are billed
  # at a large multiplier, so the older-Go legs here would re-run the same
  # unit suite at high cost for no platform signal. `stable` only.
  cross-platform:
    name: ${{ matrix.os }} unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # OS is the only matrix axis: the ubuntu legs already cover the older
        # Go version, so a second dimension with a single fixed value would
        # only suggest multi-Go legs were planned.
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      # The integration suites are excluded: they need a real backend,
      # which neither of these runners provides for both backends.
      - run: go build ./...
      - run: go test ./...

  # Unit tests run against a fake CLI runner, so the cheaper Linux
  # runner is enough; integration tests need real Apple Container and
  # run locally via `make integration`.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.0', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The token is only needed to clone. Leaving it in .git/config
          # makes it readable by any later step, including code under test.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test ./...

  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.0', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: go test -race ./...

  # golangci-lint runs govet as part of its default linter set.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Match the golangci-lint binary's supported export-data format.
          go-version: '1.27.2'
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # v2.13.0 cannot decode Go 1.27 export data (version 5).
          version: v2.14.0

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Scan with a patched toolchain, not the go 1.25.0 floor in
          # bench/go.mod (that release still reports fixed stdlib CVEs).
          # Pin the patch level: floating `stable` can lag security fixes.
          go-version: '1.27.2'
      # Pinned rather than @latest, so the same commit always scans the same
      # tool version. Bump the pin deliberately.
      #
      # bench/ is a separate module, so the root ./... does not reach it.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
        working-directory: bench

  # bench/ is a separate module, so no job above reaches it: they all run
  # ./... from the root. Without this a Dependabot bump of bench/go.mod would
  # merge with no signal that the module still builds.
  bench-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # The module this job builds, not the root one. The root go.mod
          # declares an older toolchain than bench/go.mod, so deriving from
          # the root fails the build with "go.mod requires go >=" instead
          # of building anything.
          go-version-file: bench/go.mod
      - run: go build ./...
        working-directory: bench
      - run: go test ./...
        working-directory: bench

  # actionlint validates workflow syntax, expressions, and runner labels. It
  # does not check action pinning or job timeouts; internal/workflowcheck
  # guards those, and runs as part of `go test ./...` so it is checked locally
  # too.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # actionlint@v1.7.12 requires go >= 1.25; the root go.mod floor is
          # 1.23.0 and GOTOOLCHAIN=local would refuse to download a newer one.
          go-version-file: bench/go.mod
      # No path argument: actionlint discovers .github/workflows itself, so a
      # workflow added with the .yaml extension is covered too. A shell glob
      # over *.yml would silently skip it.
      - name: Lint workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=

  # Docker is preinstalled on ubuntu-latest, and this job hands the daemon to
  # the checked-out code. The trusted triggers are enumerated rather than
  # negated: under pull_request_target or workflow_run a fork's code is still
  # untrusted while the base-branch token is available, so a
  # "not pull_request" test would pass them straight through.
  #
  # NOTE: fork PRs skip this job, and a skipped job reports no check run. Keep
  # it out of the required-check set, or fork PRs will wait for a status that
  # never arrives and can never merge. The branch is currently unprotected, so
  # this is a constraint on future protection settings, not a live problem.
  # There is no maintainer-run path for a fork PR's Docker suite today; adding
  # one (e.g. a dispatch `ref` input) is a separate feature.
  integration-docker:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.23.0', 'stable']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go-version }}
      - run: make integration-docker
        env:
          # A missing or broken Docker backend must fail this required job
          # rather than skip every test and report success.
          REQUIRE_BACKEND: '1'
          CONTAINERGO_BACKEND: docker
