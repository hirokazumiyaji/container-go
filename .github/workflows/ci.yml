name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Unit tests run against a fake CLI runner, so the cheaper Linux
  # runner is enough; integration tests need real Apple Container and
  # run locally via `make integration`.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
